name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates, Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Types (mypy --strict)
        run: python -m mypy

      - name: Tests with coverage gate
        run: python -m pytest

      - name: Validate workflow surfaces
        run: python scripts/check_workflow.py

      - name: Mutation harness
        run: |
          python scripts/mutation_check.py --control
          python scripts/mutation_check.py

      - name: Build docs with warnings as errors
        run: sphinx-build -b html docs _build/html -W

  build-variant:
    name: Build the BC variant
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gfortran meson ninja-build patchelf
          # The compiler version is provenance: a build that produces different numbers from the
          # oracle needs to be told apart from one that does not, and until now nothing recorded it.
          gfortran --version | head -1
          nproc
          grep -m1 "model name" /proc/cpuinfo || true

      - name: Install the build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson-python ninja numpy setuptools_scm

      - name: Check out the pinned fork and its FVS source
        run: |
          git clone --filter=blob:none https://github.com/UBC-FRESH/PyFVS.git "$RUNNER_TEMP/PyFVS"
          git -C "$RUNNER_TEMP/PyFVS" checkout e95172b
          git -C "$RUNNER_TEMP/PyFVS" submodule update --init --recursive
          echo "FVS source at $(git -C "$RUNNER_TEMP/PyFVS/fvs" rev-parse --short HEAD)"

      - name: Apply the banked patch sets
        run: |
          gunzip -c notes/reference/pyfvs-patchset.diff.gz > "$RUNNER_TEMP/pyfvs.patch"
          gunzip -c notes/reference/fvsbc-patchset.diff.gz > "$RUNNER_TEMP/fvsbc.patch"
          git -C "$RUNNER_TEMP/PyFVS" apply --check "$RUNNER_TEMP/pyfvs.patch"
          git -C "$RUNNER_TEMP/PyFVS" apply "$RUNNER_TEMP/pyfvs.patch"
          git -C "$RUNNER_TEMP/PyFVS/fvs" apply --check "$RUNNER_TEMP/fvsbc.patch"
          git -C "$RUNNER_TEMP/PyFVS/fvs" apply "$RUNNER_TEMP/fvsbc.patch"

      - name: Build the BC variant
        working-directory: ${{ runner.temp }}/PyFVS
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.3.11"
        run: |
          python -m pip install --no-build-isolation . \
            --config-settings=setup-args="-Dfvsvariants=bc"

      - name: Import the built variant
        run: |
          python -c "import pyfvs.fvsbc as m; print('imported', m.__name__)"
          python -c "import pyfvs; print(pyfvs.list_variants())"

      # These skip in the quality job, which has no extension. This job has the extension and FVS's
      # own case data in one place, so they run here rather than being skips nobody ever converts.
      #
      # test_oracle.py first ran here beside test_run.py and failed on 104 of 164 rows. The cause was
      # not the toolchain: FVS keeps its state in the process, so a case run after another projection
      # produces different numbers. The test now runs its case in a child process, and it passes in
      # either order.
      - name: Run the tests that need the extension
        env:
          FVSBC_CASE_DIR: ${{ runner.temp }}/PyFVS/fvs/tests/FVSbc
        run: |
          python -m pip install --quiet pytest pandas
          python -m pytest tests/test_run.py tests/test_oracle.py -q -o addopts="" -p no:cacheprovider

  dashboard:
    name: Green dashboard summary
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Both interpreters, because P3's seventh criterion says the dashboard exits zero on both and
      # the script used to run on 3.12 only. The job's name is deliberately unchanged: matrixing it
      # would rename the required context, and P2 records a protection change that dropped two.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the dev requirements for both
        run: |
          for version in 3.11 3.12; do
            "python$version" -m pip install --upgrade pip
            "python$version" -m pip install -r requirements-dev.txt
          done

      - name: Run the dashboard on both versions
        shell: bash
        run: |
          set +e
          mkdir -p runtime
          status=0
          for version in 3.11 3.12; do
            echo "### Dashboard on Python $version" >> "$GITHUB_STEP_SUMMARY"
            "python$version" scripts/dashboard.py --markdown \
              --json "runtime/dashboard-$version.json" > "runtime/dashboard-$version.md"
            code=$?
            cat "runtime/dashboard-$version.md" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" -ne 0 ]; then status="$code"; fi
          done
          exit "$status"

      - name: Upload the dashboard records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-record
          path: runtime/

  pre-commit:
    name: Pre-commit parity
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure
